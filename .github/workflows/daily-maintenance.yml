name: Daily repository maintenance

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-repository-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Unit test
        run: pnpm test
      - name: Validate versioned research artifacts
        run: pnpm run research:validate:artifacts
      - name: Validate credential-safe automation manifest
        run: pnpm run automation:validate-manifest
      - name: Validate redacted execution-record generator
        run: pnpm run automation:record -- --check
      - name: Check formatting
        run: pnpm exec prettier --check scripts .github/workflows
